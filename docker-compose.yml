services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: soillab
    ports:
      - "5432:5432"
    volumes:
      - soillab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d soillab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soillab_pg:
